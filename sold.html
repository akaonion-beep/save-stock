<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>최근 7일 판매된 차량</title>
<style>
/* 판매 기록: 날짜별 묶음 목록. 본 재고 페이지와 같은 밝은 화면 하나만 씁니다. */
@font-face{font-family:Pretendard;src:url('assets/Pretendard-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Pretendard;src:url('assets/Pretendard-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:Pretendard;src:url('assets/Pretendard-Bold.woff2') format('woff2');font-weight:700 900;font-display:swap}
:root{--ink:#1a1a1a;--muted:#777;--line:#e5e5e5;--paper:#fff;--soft:#f7f7f7;--red:#ed1c24;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
header,main{max-width:1200px;margin:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{color:var(--red);font-weight:700;font-size:18px}.brand strong{color:#333;font-size:26px;margin-left:4px;letter-spacing:-1.5px}
.back{font-size:14px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:6px 14px}.back:hover,.back:focus-visible{border-color:var(--ink);outline:none}
main{padding-block:28px 60px}
h1{font-size:28px;margin:0 0 4px;text-wrap:balance;letter-spacing:-1px}
.lead{margin:0 0 26px;color:var(--muted)}
.day{margin-top:30px}.day h2{font-size:17px;margin:0 0 12px;display:flex;gap:10px;align-items:baseline}.day h2 span{font-size:13px;color:var(--muted);font-weight:600}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.car{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper);min-width:0}
.car .ph{position:relative;aspect-ratio:600/440;max-width:100%;background:var(--soft)}.car img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.35)}
.tag{position:absolute;left:10px;top:10px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;border-radius:5px;padding:2px 8px}
.car .b{padding:12px 14px 14px}.car h3{font-size:15px;margin:0;line-height:1.35}.trim{font-size:12px;color:var(--muted);margin-top:2px}
.spec{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:#444;margin-top:8px;font-variant-numeric:tabular-nums}
.last{margin-top:8px;font-size:13px}.last b{font-size:16px;font-variant-numeric:tabular-nums}
.empty{padding:60px 0;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
@media(max-width:430px){.list{grid-template-columns:1fr}h1{font-size:23px}}
.acts{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:12px}.acts a,.acts span{display:flex;align-items:center;justify-content:center;height:38px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-weight:600;color:#222;text-decoration:none;white-space:nowrap}.acts a.report{border-color:#ff3333;color:#ff3333}.acts span{color:#999;font-weight:400}.past{margin:0 0 8px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}.past label{display:block;font-weight:700;margin-bottom:8px}.pastrow{display:flex;gap:8px}.pastrow input{flex:1;min-width:0;height:42px;border:1px solid #ccc;border-radius:8px;padding:0 12px;font:inherit;background:#fff}.pastrow button{height:42px;padding:0 18px;border:0;border-radius:8px;background:var(--red);color:#fff;font:inherit;font-weight:700;cursor:pointer}.past small{display:block;margin-top:6px;color:var(--muted);font-size:12px}#pastOut{margin-top:18px}#pastOut h2{font-size:17px;margin:0 0 12px}.car mark{background:none;color:#ff3333;font-weight:800}.notag{position:static;display:inline-block;margin-bottom:6px}.pq{position:relative;flex:1;min-width:0;display:flex}.pq input{width:100%}.plate-suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;margin:0;padding:6px 0;list-style:none;background:#fff;border:1px solid #ddd;border-radius:12px;box-shadow:0 8px 24px #0002;text-align:left}.plate-suggest .ps-head{padding:4px 16px 6px;font-size:12px;color:#888}.plate-suggest button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;padding:9px 16px;border:0;background:none;font:inherit;cursor:pointer;text-align:left;height:auto;color:inherit}.plate-suggest button:hover,.plate-suggest button:focus{background:#fff3f3;outline:none}.plate-suggest b{font-size:15px;color:#555;white-space:nowrap}.plate-suggest b mark{background:none;color:#ff3333;font-weight:800}.plate-suggest span{font-size:12px;color:#777;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:auto;text-align:right;min-width:0}@keyframes btnJump{0%,30%,100%{transform:translateY(0)}10%{transform:translateY(-7px)}20%{transform:translateY(0)}}.acts a{display:flex;align-items:center;justify-content:center;box-sizing:border-box;background:#fff0f0!important;color:#d9001b!important;border:1.5px solid #d9001b!important;font-weight:700!important;text-decoration:none;-webkit-tap-highlight-color:transparent;transition:filter .12s;animation:btnJump 2.4s ease-out infinite}.acts a.report{background:#d9001b!important;color:#fff!important;animation-delay:1.2s}.acts a:hover{filter:brightness(1.05)}.acts a:active{filter:brightness(.9)}.acts a:focus-visible{outline:3px solid #ffb3b3;outline-offset:2px}@media (prefers-reduced-motion:reduce){.acts a{animation:none}}.view-nav{position:sticky;top:0;z-index:40;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 16px;background:#fff;border-bottom:1px solid #eee;-webkit-overflow-scrolling:touch}.view-nav::-webkit-scrollbar{display:none}.view-nav a{flex:none;display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 14px;border:1px solid #ddd;border-radius:999px;font-size:13px;font-weight:700;color:#333;text-decoration:none;white-space:nowrap;background:#fff}.view-nav a b{color:#d9001b;font-weight:800}.view-nav a.on{background:#d9001b;border-color:#d9001b;color:#fff}.view-nav a.on b{color:#fff}@media(min-width:900px){.view-nav{justify-content:center}}</style></head><body>
<header><a class="brand" href="index.html">딸깍 <strong>마이카</strong> 세이브</a></header><nav class="view-nav" aria-label="메뉴"><a href="index.html#upcoming" data-view=upcoming>입고 예정<b id="navUp"></b></a><a href="index.html#today" data-view=today>금일 입고<b id="navToday"></b></a><a href="sold.html" data-view=sold class="on" aria-current="page">최근 7일 판매</a></nav>
<main><h1>최근 7일 판매된 차량</h1><p class="lead" id="lead">재고에서 빠진 차량을 날짜별로 모았어요. 최근 7일 판매분만 보여드려요.</p><form class="past" id="past" role="search"><label for="pastQ">과거 판매 차량 불러오기</label><div class="pastrow"><div class="pq"><input id="pastQ" type="search" aria-controls="pastSuggest" autocomplete="off" maxlength="30" placeholder="차량번호 또는 차종 (예: 4157, 그랜저)"><ul class="plate-suggest" id="pastSuggest" hidden></ul></div><button type="submit">검색</button></div><small>7일이 지나 보관된 기록까지 찾아요.</small></form><div id="pastOut" hidden></div><div id="out"></div></main>
<script>(()=>{let idx=null;const chunks={},want=new Set();
const load=n=>chunks[n]||(chunks[n]=fetch('data/img-'+n+'.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>({})));
const fix=img=>{const u=img.getAttribute('src')||'';if(!u.startsWith('https://img-mycarsave'))return;if(!idx){want.add(img);return;}const n=idx[u];if(n===undefined){img.removeAttribute('src');return;}img.removeAttribute('src');load(n).then(c=>{if(c[u])img.src=c[u];});};
const scan=root=>{if(root.tagName==='IMG')fix(root);root.querySelectorAll&&root.querySelectorAll('img').forEach(fix);};
new MutationObserver(ms=>{for(const m of ms){if(m.type==='attributes')fix(m.target);else m.addedNodes.forEach(n=>n.nodeType===1&&scan(n));}}).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['src']});
fetch('data/img-index.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>({})).then(d=>{idx=d;want.forEach(fix);want.clear();scan(document);});})();</script><script>
const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString('ko-KR'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function weekStart(now=Date.now()){const k=new Date(now+9*3600e3);k.setUTCHours(0,0,0,0);k.setUTCDate(k.getUTCDate()-k.getUTCDay());return k.getTime()-9*3600e3;}
const kst=t=>new Date(Date.parse(t)+9*3600e3),dayKey=t=>kst(t).toISOString().slice(0,10),W='일월화수목금토';
const dayLabel=k=>{const d=new Date(k+'T00:00:00Z');return (d.getUTCMonth()+1)+'월 '+d.getUTCDate()+'일 ('+W[d.getUTCDay()]+')';};
const time=t=>{const d=kst(t);return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');};
function card(c){return `<article class="car"><div class="ph">${c.image?`<img src="${esc(c.image)}" alt="${esc(c.name)}" loading="lazy" referrerpolicy="no-referrer">`:''}<span class="tag">판매 완료</span></div><div class="b"><h3>${esc(c.brand)} ${esc(c.name)}</h3><div class="trim">${esc(c.trim)}</div><div class="spec"><span>${esc(c.plate)}</span><span>${c.year}년형</span><span>${fmt(c.mileage)}km</span><span>${esc(c.fuel)}</span>${c.color?`<span>${esc(c.color)}</span>`:''}</div>${c.lastPrice?`<div class="last">마지막 월 렌탈료 <b>${fmt(c.lastPrice)}</b>원</div>`:''}<div class="acts"><a href="https://mycarsave.lotterentacar.net/cr/search/view?carId=${encodeURIComponent(c.id)}" target="_blank" rel="noopener">차량 상세 ↗</a>${c.eqpm?`<a class="report" href="https://mycarsave.lotterentacar.net/cr/search/report?eqpmNo=${encodeURIComponent(c.eqpm)}" target="_blank" rel="noopener">마이카세이브 리포트 ↗</a>`:'<span>리포트 확인 필요</span>'}</div></div></article>`;}
const norm=v=>String(v||'').replace(/\s+/g,'').toLowerCase();let ARCH=null,RECENT=[];
async function loadArchive(){if(ARCH)return ARCH;try{ARCH=await fetch('data/sold-archive.json',{cache:'no-store'}).then(r=>r.ok?r.json():[])}catch{ARCH=[]}return ARCH}
function pastCard(c,raw=''){const day=dayKey(c.soldAt);return `<article class="car"><div class="b"><span class="tag notag">${dayLabel(day)} ${time(c.soldAt)} 판매</span><h3>${esc(c.brand)} ${esc(c.name)}</h3><div class="trim">${esc(c.trim)}</div><div class="spec"><span><b>${raw?plateMark(c.plate,raw):esc(c.plate)}</b></span><span>${c.year}년형</span><span>${fmt(c.mileage)}km</span><span>${esc(c.fuel)}</span>${c.color?`<span>${esc(c.color)}</span>`:''}</div>${c.lastPrice?`<div class="last">마지막 월 렌탈료 <b>${fmt(c.lastPrice)}</b>원</div>`:''}<div class="acts"><a href="https://mycarsave.lotterentacar.net/cr/search/view?carId=${encodeURIComponent(c.id)}" target="_blank" rel="noopener">차량 상세 ↗</a>${c.eqpm?`<a class="report" href="https://mycarsave.lotterentacar.net/cr/search/report?eqpmNo=${encodeURIComponent(c.eqpm)}" target="_blank" rel="noopener">마이카세이브 리포트 ↗</a>`:'<span>리포트 확인 필요</span>'}</div></div></article>`;}
function plateNorm(v){return String(v||'').replace(/\s+/g,'').toLowerCase()}
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function plateDistance(q,plate){if(plate.includes(q))return 0;let best=lev(q,plate);for(const L of [q.length-1,q.length,q.length+1])for(let i=0;L>0&&i+L<=plate.length;i++)best=Math.min(best,lev(q,plate.slice(i,i+L)));return best}
function plateMark(plate,raw){const q=[...plateNorm(raw)],p=[...String(plate||'')],P=p.map(c=>c.toLowerCase());if(!q.length)return esc(p.join(''));
 const L=Array.from({length:p.length+1},()=>new Array(q.length+1).fill(0));for(let i=p.length-1;i>=0;i--)for(let j=q.length-1;j>=0;j--)L[i][j]=P[i]===q[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
 const hit=new Set();for(let i=0,j=0;i<p.length&&j<q.length;){if(P[i]===q[j]){hit.add(i);i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++;}
 return p.map((c,i)=>hit.has(i)?'<mark>'+esc(c)+'</mark>':esc(c)).join('').replace(/<\/mark><mark>/g,'');}
function pastPool(){const seen=new Set();return [...RECENT,...(ARCH||[])].filter(c=>{const k=c.id+'|'+c.soldAt;if(seen.has(k))return false;seen.add(k);return true})}
function pastMatches(raw,limit){const q=plateNorm(raw);if(q.length<2)return[];const digits=(q.match(/\d/g)||[]).length>=2,allowed=q.length<=3?1:2;
 return pastPool().map(c=>{const p=plateNorm(c.plate),name=norm([c.brand,c.name,c.trim].join(''));const d=p.includes(q)||name.includes(q)?0:digits?plateDistance(q,p):99;return{c,d}}).filter(x=>x.d<=allowed).sort((a,b)=>a.d-b.d||Date.parse(b.c.soldAt)-Date.parse(a.c.soldAt)).slice(0,limit)}
function renderPastSuggest(){const box=$('pastSuggest'),raw=$('pastQ').value,list=pastMatches(raw,6);if(!list.length||document.activeElement!==$('pastQ')&&!box.contains(document.activeElement)){box.hidden=true;box.innerHTML='';return}
 const exact=list.some(x=>x.d===0);box.innerHTML='<li class="ps-head">'+(exact?'일치하는 판매 차량':'정확히 일치하는 번호가 없어요 · 비슷한 번호')+'</li>'+list.map(x=>'<li><button type="button" data-plate="'+esc(x.c.plate)+'"><b>'+plateMark(x.c.plate,raw)+'</b><span>'+esc([x.c.brand,x.c.name].filter(Boolean).join(' '))+'</span></button></li>').join('');box.hidden=false}
$('pastQ').addEventListener('focus',()=>{loadArchive().then(renderPastSuggest)});$('pastQ').addEventListener('input',renderPastSuggest);
$('pastQ').addEventListener('keydown',e=>{if(e.key==='ArrowDown'&&!$('pastSuggest').hidden){e.preventDefault();$('pastSuggest').querySelector('button')?.focus()}if(e.key==='Escape')$('pastSuggest').hidden=true});
$('pastSuggest').addEventListener('keydown',e=>{const bs=[...$('pastSuggest').querySelectorAll('button')],i=bs.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();bs[Math.min(i+1,bs.length-1)]?.focus()}if(e.key==='ArrowUp'){e.preventDefault();i<=0?$('pastQ').focus():bs[i-1].focus()}if(e.key==='Escape'){$('pastSuggest').hidden=true;$('pastQ').focus()}});
$('pastSuggest').addEventListener('click',e=>{const b=e.target.closest('button[data-plate]');if(!b)return;$('pastQ').value=b.dataset.plate;$('pastSuggest').hidden=true;$('past').requestSubmit()});
document.addEventListener('click',e=>{if(!$('past').contains(e.target))$('pastSuggest').hidden=true});
$('past').addEventListener('submit',async e=>{e.preventDefault();$('pastSuggest').hidden=true;const raw=$('pastQ').value,box=$('pastOut');if(plateNorm(raw).length<2){box.hidden=false;box.innerHTML='<div class="empty">두 글자 이상 입력해 주세요.</div>';return}
 box.hidden=false;box.innerHTML='<div class="empty">찾는 중…</div>';await loadArchive();const hits=pastMatches(raw,60),exact=hits.some(x=>x.d===0);
 box.innerHTML=hits.length?`<h2>${exact?'검색 결과':'정확히 일치하는 차가 없어 비슷한 번호를 보여드려요 ·'} ${hits.length}대${hits.length===60?' (최근 60대까지)':''}</h2><div class="list">${hits.map(x=>pastCard(x.c,raw)).join('')}</div>`:'<div class="empty">찾는 판매 기록이 없어요.</div>';});
fetch('data/sold.json',{cache:'no-store'}).then(r=>r.ok?r.json():{cars:[]}).catch(()=>({cars:[]})).then(d=>{
 RECENT=d.cars||[];const start=Date.now()-7*86400000,cars=(d.cars||[]).filter(c=>Date.parse(c.soldAt)>=start).sort((a,b)=>Date.parse(b.soldAt)-Date.parse(a.soldAt));
 if(d.updatedAt)$('lead').textContent='재고에서 빠진 차량을 날짜별로 모았어요. 최근 7일 판매분만 보여드려요. · 총 '+cars.length+'대 · '+time(d.updatedAt)+' 확인';
 if(!cars.length){$('out').innerHTML='<div class="empty">최근 7일 동안 판매된 차량이 없어요.<br>재고는 9시부터 18시까지 매시간 확인합니다.</div>';return;}
 const groups=new Map();for(const c of cars){const k=dayKey(c.soldAt);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(c);}
 $('out').innerHTML=[...groups].map(([k,list])=>`<section class="day"><h2>${dayLabel(k)}<span>${list.length}대</span></h2><div class="list">${list.map(card).join('')}</div></section>`).join('');
});
</script></body></html>
